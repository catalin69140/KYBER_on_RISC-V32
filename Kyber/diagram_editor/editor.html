<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyber Primary Diagram Editor</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121c2f;
      --panel-border: #2a3a5a;
      --text: #eef3ff;
      --muted: #9cb3dd;
      --accent: #80b6ff;
      --danger: #ff8f86;
      --ok: #43d17e;
      --input-bg: #0e1728;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at 25% 15%, #182947 0%, var(--bg) 55%);
      color: var(--text);
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    #topbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 23, 42, 0.95);
      backdrop-filter: blur(2px);
      flex-wrap: wrap;
    }

    #topbar input[type="text"] {
      min-width: 340px;
    }

    #main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 300px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(18, 28, 47, 0.96), rgba(10, 18, 32, 0.98));
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      min-height: 0;
    }

    #toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
    }

    .tool-group {
      border: 1px solid #304767;
      border-radius: 8px;
      padding: 8px;
      background: rgba(15, 24, 41, 0.7);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tool-group h3 {
      margin: 0 0 4px;
      font-size: 13px;
      color: #c8d8ff;
      letter-spacing: 0.2px;
    }

    .tool-icon-grid {
      display: grid;
      gap: 6px;
    }

    .shape-tool-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .connection-tool-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .tool-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 42px;
      padding: 6px;
    }

    .connection-tool-grid .tool-icon-button {
      min-height: 38px;
      padding: 5px 6px;
    }

    .tool-icon-svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 34px;
      max-height: 26px;
      overflow: visible;
    }

    .connection-tool-grid .tool-icon-svg {
      max-width: 42px;
      max-height: 22px;
    }

    #canvas-shell {
      position: relative;
      overflow: hidden;
      padding: 0;
      background: #08101d;
    }

    #canvas-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: 40px 40px 96px;
      gap: 6px;
      background: rgba(4, 10, 20, 0.8);
      border: 1px solid #2c446c;
      border-radius: 8px;
      padding: 6px;
    }

    #zoom-in-btn,
    #zoom-out-btn {
      width: 40px;
      min-width: 40px;
      padding-left: 0;
      padding-right: 0;
      text-align: center;
    }

    #recenter-btn,
    #zoom-reset-btn {
      width: 96px;
      min-width: 96px;
    }

    #zoom-reset-btn {
      grid-column: 3;
      grid-row: 2;
    }

    .zoom-control-row {
      display: block;
      min-width: 0;
      grid-column: 1 / 3;
      grid-row: 2;
    }

    .zoom-combobox {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      width: 100%;
      min-width: 0;
      border: 1px solid #2c446c;
      border-radius: 8px;
      overflow: visible;
      background: linear-gradient(180deg, #1a2b47, #11203a);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      z-index: 24;
    }

    .zoom-combobox.open {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(128, 182, 255, 0.25);
    }

    #zoom-input {
      width: 100%;
      min-width: 0;
      text-align: right;
      padding: 7px 8px;
      padding-right: 6px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    #zoom-menu-btn {
      border: 0;
      border-left: 1px solid #2c446c;
      border-radius: 0;
      padding: 0;
      min-width: 28px;
      background: rgba(10, 18, 32, 0.18);
    }

    .zoom-suffix {
      text-align: center;
      color: #cfe1ff;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      transform: translateY(-1px);
    }

    .zoom-presets-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      border: 1px solid #2c446c;
      border-radius: 8px;
      background: rgba(7, 14, 26, 0.96);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      z-index: 20;
    }

    .zoom-combobox.open .zoom-presets-menu {
      display: flex;
    }

    .zoom-preset-option {
      width: 100%;
      padding: 5px 8px;
      text-align: right;
      border-radius: 6px;
      background: rgba(19, 33, 56, 0.92);
    }

    .zoom-preset-option:hover,
    .zoom-preset-option.active {
      border-color: var(--accent);
    }

    #canvas-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 4px;
      cursor: grab;
      background: #060c18;
    }

    #canvas-scroll.panning {
      cursor: grabbing;
    }

    #diagram-canvas {
      display: block;
      background: transparent;
      border: 0;
      border-radius: 0;
      touch-action: none;
      user-select: none;
    }

    #inspector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: auto;
    }

    h2, h3 {
      margin: 0 0 8px;
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    h3 {
      font-size: 14px;
      margin-top: 8px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .inline-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inline-field label {
      width: 52px;
      margin: 0;
      flex: 0 0 auto;
    }

    .inline-field input,
    .inline-field select {
      flex: 1 1 auto;
      min-width: 0;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid #2c446c;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 8px;
      font-family: inherit;
      font-size: 13px;
    }

    textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.3;
    }

    .rich-text-editor {
      min-height: 88px;
      background: var(--input-bg);
      border: 1px solid #2c446c;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      outline: none;
    }

    .rich-text-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(128, 182, 255, 0.3) inset;
    }

    .format-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin-top: 6px;
    }

    .format-row button {
      padding: 6px 4px;
      min-width: 0;
    }

    .format-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      line-height: 1;
      font-size: 15px;
    }

    .align-icon {
      display: inline-flex;
      width: 100%;
      justify-content: center;
    }

    .align-icon.left {
      justify-content: flex-start;
    }

    .align-icon.center {
      justify-content: center;
    }

    .align-icon.right {
      justify-content: flex-end;
    }

    .text-style-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px 92px;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .text-style-row select {
      width: 100%;
    }

    .text-style-row .compact-color {
      width: 38px;
      min-width: 38px;
      height: 38px;
      padding: 2px;
      border-radius: 8px;
      justify-self: stretch;
    }

    .text-style-row .font-size-input {
      width: 100%;
      min-width: 0;
    }

    .border-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 8px;
      align-items: center;
    }

    .color-inline-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .color-inline-row label {
      margin: 0;
      white-space: nowrap;
    }

    .color-inline-row input[type="color"] {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 2px;
      border-radius: 8px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 4px;
    }

    .switch-row label {
      margin: 0;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 24px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }

    .switch-slider {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: #314764;
      border: 1px solid #42628f;
      position: relative;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .switch-slider::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #eef3ff;
      transition: transform 120ms ease;
    }

    .switch input:checked + .switch-slider {
      background: rgba(67, 209, 126, 0.3);
      border-color: #43d17e;
    }

    .switch input:checked + .switch-slider::after {
      transform: translateX(22px);
    }

    input[type="checkbox"] {
      transform: translateY(1px);
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      border-radius: 8px;
      border: 1px solid #2c446c;
      background: var(--input-bg);
      padding: 2px;
    }

    button {
      border: 1px solid #2c446c;
      color: var(--text);
      background: linear-gradient(180deg, #1a2b47, #11203a);
      border-radius: 8px;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--ok);
      box-shadow: 0 0 0 1px rgba(67, 209, 126, 0.45) inset;
    }

    button.danger {
      border-color: #91403a;
      background: linear-gradient(180deg, #592a25, #3f1a17);
      color: #ffd6d1;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .palette-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .palette-block.spaced {
      margin-bottom: 6px;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
      padding: 0;
    }

    .swatch.active {
      border-color: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
    }

    #status {
      border-top: 1px solid var(--panel-border);
      min-height: 36px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(11, 18, 32, 0.92);
    }

    .empty-state {
      border: 1px dashed #3b5787;
      border-radius: 8px;
      padding: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 1400px) {
      #main {
        grid-template-columns: 200px minmax(0, 1fr) 270px;
      }
    }

    @media (max-width: 1080px) {
      #main {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(380px, 1fr) auto;
      }

      #toolbar, #inspector {
        max-height: 260px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <strong>Kyber Primary Diagram Editor</strong>
      <label for="elf-input" style="margin:0 0 0 10px;color:#c9dbff;">ELF / diagram name</label>
      <input id="elf-input" type="text" placeholder="crypto_kem_kyber768_kyber768r1_hashing.elf" />
      <button id="load-btn">Load</button>
      <button id="save-btn">Save Store</button>
      <button id="generate-btn">Generate Full renderPrimaryReferenceDiagram()</button>
    </div>

    <div id="main">
      <aside id="toolbar" class="panel">
        <div class="tool-group">
          <button id="tool-select" class="active">Select / Move</button>
          <button id="delete-btn" class="danger">Delete Selected</button>
        </div>

        <div class="tool-group">
          <h3>Connection Tools</h3>
          <div id="connection-tools-grid" class="tool-icon-grid connection-tool-grid"></div>
        </div>

        <div class="tool-group">
          <h3>Shape Tools</h3>
          <div id="shape-tools-grid" class="tool-icon-grid shape-tool-grid"></div>
        </div>

        <div class="tool-group">
          <h3>Container Tools</h3>
          <button id="add-container-standard-btn">Standard Container</button>
          <button id="add-container-header-btn">Header Container</button>
        </div>

        <div class="tool-group">
          <h3>Group Forms</h3>
          <button id="add-component-group-btn">Component Group</button>
        </div>
      </aside>

      <section id="canvas-shell" class="panel">
        <div id="canvas-toolbar">
          <button id="zoom-in-btn">+</button>
          <button id="zoom-out-btn">-</button>
          <button id="recenter-btn">Recenter</button>
          <button id="zoom-reset-btn">Reset</button>
          <div class="zoom-control-row">
            <div id="zoom-combobox" class="zoom-combobox">
              <input id="zoom-input" type="text" inputmode="numeric" value="100" aria-label="Zoom percent" autocomplete="off" />
              <button id="zoom-menu-btn" type="button" aria-label="Open zoom presets"><span class="zoom-suffix">▾</span></button>
              <div id="zoom-presets-menu" class="zoom-presets-menu" role="listbox" aria-label="Zoom presets">
                <button type="button" class="zoom-preset-option" data-zoom-preset="5">5%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="25">25%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="50">50%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="75">75%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="100">100%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="125">125%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="150">150%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="175">175%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="200">200%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="300">300%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="400">400%</button>
                <button type="button" class="zoom-preset-option" data-zoom-preset="500">500%</button>
              </div>
            </div>
          </div>
        </div>
        <div id="canvas-scroll">
          <svg id="diagram-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </section>

      <aside id="inspector" class="panel">
        <h2>Inspector</h2>
        <div id="inspector-content" class="empty-state">Select a shape or arrow to edit properties.</div>
      </aside>
    </div>

    <div id="status">Ready.</div>
  </div>

  <script src="/editor.js"></script>
</body>
</html>
